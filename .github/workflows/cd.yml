name: Build docker SVU image and deploy to VM

on:
  push:
    branches:
      - 142-refactor-cd-vpn

env:
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/ventanillaunica

jobs:
  build-and-push:
    name: Generate Docker image and push to registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker image with Jib
        run: ./mvnw package -Pprod -DskipTests jib:build -Djib.to.image=${{ env.IMAGE_NAME }}:latest

      - name: Print image details
        run: echo "Pushed image ${{ env.IMAGE_NAME }}:latest"

  deploy-to-vm:
    name: Deploy app to ITP VM via VPN and SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Host Kernel Modules
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe af_key
          sudo modprobe l2tp_ppp
          sudo modprobe ppp_generic
          sudo modprobe ppp_async

      - name: Connect to L2TP/IPsec VPN
        run: |
          docker run -d --name vpn-client --privileged --net=host \
            -v /lib/modules:/lib/modules:ro \
            -e VPN_SERVER_IPV4='${{ secrets.VPN_SERVER_IP }}' \
            -e VPN_PSK='${{ secrets.VPN_PSK }}' \
            -e VPN_USERNAME='${{ secrets.VPN_USERNAME }}' \
            -e VPN_PASSWORD='${{ secrets.VPN_PASSWORD }}' \
            ubergarm/l2tp-ipsec-vpn-client

          echo "Waiting for ppp0 interface to establish..."

          # Smart loop to wait up to 45 seconds for ppp0 to appear
          for i in {1..45}; do
            if ip link show ppp0 > /dev/null 2>&1; then
              echo "✅ VPN connection established successfully!"
              ip a show ppp0
              break
            fi
            echo "Waiting... ($i/45)"
            sleep 1
          done

          # If the loop finishes and ppp0 still doesn't exist, fail the job and print logs
          if ! ip link show ppp0 > /dev/null 2>&1; then
            echo "❌ VPN failed to create ppp0 interface."
            echo "==== VPN CONTAINER LOGS ===="
            docker logs vpn-client
            exit 1
          fi

          echo "==== NETWORK INTERFACES ===="
          ip a

      - name: Route Traffic through VPN
        run: |
          sudo ip route add ${{ secrets.VPS_HOST }} dev ppp0

      - name: Copy Docker Compose files to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: 'src/main/docker/app.yml,src/main/docker/mongodb.yml'
          target: '~/svu'
          strip_components: 3

      - name: Deploy to VM using SSH and create .env file
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p ~/svu
            cd ~/svu/

            echo "SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}" > .env
            echo "SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}" >> .env
            echo "JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${{ secrets.JHIPSTER_JWT_SECRET }}" >> .env
            echo "GOOGLE_RECAPTCHA_SECRET_KEY=${{ secrets.GOOGLE_RECAPTCHA_SECRET_KEY}}" >> .env

            docker pull ${{ env.IMAGE_NAME }}:latest

            docker compose -f app.yml down
            docker compose -f app.yml pull
            docker compose -f app.yml up -d --remove-orphans
