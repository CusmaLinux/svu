name: Connect to VPN and SSH

on:
  push:
    branches:
      - 142-refactor-cd-vpn

env:
  IMAGE_NAME: ventanillaunica

jobs:
  build-and-deploy:
    name: Build and deploy SVU
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Docker image directly to local VM daemon
        # jib:dockerBuild skips the registry and builds straight to the host's Docker daemon
        run: ./mvnw package -Pprod -DskipTests jib:dockerBuild -Djib.to.image=${{ env.IMAGE_NAME }}:latest

      - name: Prepare deployment directory and copy assets
        run: |
          # Ensure the target directory exists
          mkdir -p ~/deploy-svu
          
          # Copy the compose file from the repository to the persistent directory
          # Note: Adjust the path to app.yml if it is located inside src/main/docker/
          cp app.yml ~/deploy-svu/
          cp mongodb.yml ~/deploy-svu/
          
          # Write environment variables to the target directory
          echo "SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}" > ~/svu/.env
          echo "SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}" >> ~/svu/.env
          echo "JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${{ secrets.JHIPSTER_JWT_SECRET }}" >> ~/svu/.env
          echo "GOOGLE_RECAPTCHA_SECRET_KEY=${{ secrets.GOOGLE_RECAPTCHA_SECRET_KEY}}" >> ~/svu/.env

      - name: Deploy app via Docker Compose
        working-directory: ~/svu
        run: |
          docker compose -f app.yml down
          docker compose -f app.yml up -d --remove-orphans
