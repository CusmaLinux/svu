name: Connect to VPN and SSH

on:
  push:
    branches:
      - 142-refactor-cd-vpn

jobs:
  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    steps:
      - name: Install Network Manager & SSH tools
        run: |
          sudo apt-get -y update
          sudo apt-get -y install strongswan xl2tpd libstrongswan-standard-plugins libstrongswan-extra-plugins sshpass

      - name: Add Ipsec Conf
        run: |
          sudo tee /etc/ipsec.conf << EOF
          config setup

          conn %default
              ikelifetime=60m
              keylife=20m
              rekeymargin=3m
              keyingtries=1
              keyexchange=ikev1
              authby=secret

          conn VPN1
              auto=add
              keyexchange=ikev1
              authby=secret
              type=transport
              left=%defaultroute
              leftprotoport=17/1701
              rightprotoport=17/1701
              right=${{ secrets.VPN_SERVER }}
              # Removed hardcoded 3DES to allow auto-negotiation. 
              # If it fails, add them back in.
          EOF

      - name: Add Ipsec Secret
        run: |
          sudo tee /etc/ipsec.secrets << EOF
          : PSK "${{ secrets.VPN_PSK }}"
          EOF
          sudo chmod 600 /etc/ipsec.secrets

      - name: Add Ipsec Options
        run: |
          sudo tee /etc/xl2tpd/xl2tpd.conf << EOF
          [lac VPN1]
          lns = ${{ secrets.VPN_SERVER }} # Fixed variable here
          ppp debug = yes
          pppoptfile = /etc/ppp/options.l2tpd.client
          length bit = yes
          EOF

          sudo tee /etc/ppp/options.l2tpd.client << EOF
          ipcp-accept-local
          ipcp-accept-remote
          refuse-eap
          require-mschap-v2 # Changed from chap to mschap-v2 (more common)
          noccp
          noauth
          mtu 1280
          mru 1280
          noipdefault
          defaultroute
          usepeerdns
          connect-delay 5000
          name "${{ secrets.VPN_USERNAME }}"
          password "${{ secrets.VPN_PASSWORD }}"
          EOF
          sudo chmod 600 /etc/ppp/options.l2tpd.client

      - name: Restart Services
        run: |
          sudo systemctl restart ipsec
          sudo systemctl restart xl2tpd

      - name: Connect To VPN
        run: |
          # 1. Bring up the IPSec tunnel
          sudo ipsec up VPN1

          # 2. Give IPSec a second to establish
          sleep 3 

          # 3. Bring up the L2TP/PPP interface
          echo "c VPN1" | sudo tee /var/run/xl2tpd/l2tp-control

          # 4. Wait for the ppp0 interface to be created
          echo "Waiting for ppp0 interface..."
          sleep 10 

          # Display interfaces for debugging if it fails
          ip a

      - name: Add Routing for Internal Network
        run: |
          # Route traffic destined for the internal VM through the VPN interface
          # Assuming the internal VM IP is stored in secrets.SERVER_URL (10.10.13.29)
          sudo ip route add ${{ secrets.SERVER_URL }} dev ppp0

      - name: Ping Server
        run: |
          ping ${{ secrets.SERVER_URL }} -c 4

      - name: Execute SSH Command on VM
        run: |
          # Using sshpass to bypass the interactive password prompt.
          # -p 2235 specifies the custom port from your screenshot.
          # StrictHostKeyChecking=no prevents the runner from getting stuck on the "Unknown host" prompt.

          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 2235 svunica@${{ secrets.SERVER_URL }} "echo 'Successfully connected via SSH!' && uptime"
