name: Connect to VPN and SSH

on:
  push:
    branches:
      - 142-refactor-cd-vpn

jobs:
  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    steps:
      - name: Install Network Manager & SSH tools
        run: |
          sudo apt-get -y update
          sudo apt-get -y install strongswan xl2tpd libstrongswan-standard-plugins libstrongswan-extra-plugins sshpass apparmor-utils

      - name: Bypass AppArmor & Load Modules
        run: |
          sudo aa-disable /usr/sbin/pppd || true
          sudo modprobe l2tp_ppp || true

      - name: Add Ipsec Conf
        run: |
          sudo tee /etc/ipsec.conf << EOF
          config setup

          conn %default
              ikelifetime=60m
              keylife=20m
              rekeymargin=3m
              keyingtries=1
              keyexchange=ikev1
              authby=secret

          conn VPN1
              auto=add
              keyexchange=ikev1
              authby=secret
              type=transport
              left=%defaultroute
              # CHANGED: Use %any to prevent port mismatch when Azure NAT scrambles the UDP ports
              leftprotoport=17/%any
              rightprotoport=17/%any
              right=${{ secrets.VPN_SERVER_IP }}
          EOF

      - name: Add Ipsec Secret
        run: |
          sudo tee /etc/ipsec.secrets << EOF
          : PSK "${{ secrets.VPN_PSK }}"
          EOF
          sudo chmod 600 /etc/ipsec.secrets

      - name: Add Ipsec Options
        run: |
          sudo tee /etc/xl2tpd/xl2tpd.conf << EOF
          [lac VPN1]
          lns = ${{ secrets.VPN_SERVER_IP }}
          ppp debug = yes
          pppoptfile = /etc/ppp/options.l2tpd.client
          length bit = yes
          EOF

          sudo tee /etc/ppp/options.l2tpd.client << EOF
          ipcp-accept-local
          ipcp-accept-remote
          refuse-eap
          # CHANGED: Removed require-chap so the server and client can auto-negotiate the auth method
          noccp
          novj
          novjccomp
          noauth
          mtu 1280
          mru 1280
          noipdefault
          defaultroute
          usepeerdns
          connect-delay 5000
          name "${{ secrets.VPN_USERNAME }}"
          password "${{ secrets.VPN_PASSWORD }}"
          EOF
          sudo chmod 600 /etc/ppp/options.l2tpd.client

      - name: Restart Services
        run: |
          sudo systemctl restart ipsec
          sudo systemctl restart xl2tpd

      - name: Connect To VPN
        run: |
          # 1. Bring up the IPSec tunnel
          sudo ipsec up VPN1
          sleep 3 

          # 2. Bring up the L2TP/PPP interface
          echo "c VPN1" | sudo tee /var/run/xl2tpd/l2tp-control

          # 3. Wait for the ppp0 interface to be created
          echo "Waiting for ppp0 interface..."
          sleep 12 

          # Display interfaces for debugging
          ip a

          # 4. If ppp0 is missing, output the logs
          if ! ip link show ppp0 > /dev/null 2>&1; then
            echo "--------- IPSEC STATUS (Check for Bytes In/Out) ---------"
            sudo ipsec statusall
            echo "--------- L2TP / PPP LOGS ---------"
            sudo grep -E 'xl2tpd|pppd' /var/log/syslog || sudo journalctl -u xl2tpd --no-pager
            exit 1
          fi

      - name: Add Routing for Internal Network
        run: |
          # Route traffic destined for the internal VM through the VPN interface
          sudo ip route add ${{ secrets.VPS_HOST }} dev ppp0

      - name: Ping Server
        run: |
          ping ${{ secrets.VPS_HOST }} -c 4

      - name: Execute SSH Command on VM
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 2235 svunica@${{ secrets.VPS_HOST }} "echo 'Successfully connected via SSH!' && uptime"
