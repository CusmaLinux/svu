name: PQRSD Block 1 Verification

on:
  push:
    branches:
      - feat/informes-gestion-pqrsd
    paths:
      - '.github/workflows/pqrs-block1-verification.yml'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.mjs'
      - 'vitest.config.mts'
      - 'src/main/**'
      - 'src/test/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pqrs-block1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 17 / MongoDB security and data tests
    if: github.ref == 'refs/heads/feat/informes-gestion-pqrsd'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Maven wrapper
        run: |
          java -version
          chmod +x ./mvnw
          ./mvnw -version

      - name: Verify PQRSD authorization and integration with isolated MongoDB Testcontainers
        env:
          REQUIRED_UNIT_SUITES: PqrsAuthorizationServiceTest,AttachmentStorageTest,AttachmentManifestTest,AttachmentWriterCapabilityTest
          REQUIRED_INTEGRATION_SUITES: PqrsOfficeQueryIT,PqrsOfficeSecurityIT,ReportResourceSecurityIT,OfficeInboxSecurityIT,OficinaResourceIT,PublicUserResourceIT,NotificacionResourceIT,RespuestaResourceIT,ResponseSecurityIT,AttachmentOwnershipIT,AttachmentOperationStandaloneIT
        run: |
          ./mvnw -B -ntp -Dskip.installnodenpm -Dskip.npm \
            -DfailIfNoTests=true -Dfailsafe.failIfNoSpecifiedTests=true \
            -Dit.test="$REQUIRED_INTEGRATION_SUITES" checkstyle:check verify

          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          required = {
              "surefire": os.environ["REQUIRED_UNIT_SUITES"].split(","),
              "failsafe": os.environ["REQUIRED_INTEGRATION_SUITES"].split(","),
          }
          missing = []
          for runner, suites in required.items():
              for suite in suites:
                  reports = Path(f"target/{runner}-reports").glob(f"TEST-*.{suite}.xml")
                  if not any(
                      int(report.get("tests", "0")) > int(report.get("skipped", "0"))
                      for report in (ElementTree.parse(path).getroot() for path in reports)
                  ):
                      missing.append(suite)
          if missing:
              raise SystemExit("Required suites did not run: " + ", ".join(missing))
          PY

      - name: Print integration test failures and root causes
        if: failure()
        shell: bash
        run: |
          echo "::group::Failsafe summary"
          if [ -f target/failsafe-reports/failsafe-summary.xml ]; then
            cat target/failsafe-reports/failsafe-summary.xml
          fi
          echo "::endgroup::"
          echo "::group::Test errors (first 200 relevant lines)"
          if [ -d target/failsafe-reports ]; then
            grep -R -n -m 5 -E 'Caused by:|Exception|ERROR|Tests run:|Error:' target/failsafe-reports --include='*.txt' | head -200 || true
            for f in target/failsafe-reports/*.txt; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              sed -n '1,95p' "$f"
            done
          else
            echo "No Failsafe reports were generated."
          fi
          echo "::endgroup::"

      - name: Publish Maven test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqrs-block1-test-results
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Node 20 / Office and notification tests
    if: github.ref == 'refs/heads/feat/informes-gestion-pqrsd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: npm

      - name: Install locked dependencies
        id: npm_ci
        run: npm ci

      - name: Test offices
        run: |
          npm run vitest -- --run src/main/webapp/app/entities/oficina \
            --reporter=default --reporter=junit --outputFile.junit=target/vitest/offices.xml

      - name: Test notifications
        if: ${{ !cancelled() && steps.npm_ci.outcome == 'success' }}
        run: |
          npm run vitest -- --run src/main/webapp/app/entities/notification \
            --reporter=default --reporter=junit --outputFile.junit=target/vitest/notifications.xml

      - name: Publish Vitest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqrs-block1-vitest-results
          path: target/vitest/*.xml
          if-no-files-found: warn
          retention-days: 7
